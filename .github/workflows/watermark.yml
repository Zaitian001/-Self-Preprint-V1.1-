name: Auto Generate Preprint Watermark & Build Site

on:
  push:
    paths:
      - 'PREPRINTS/**.md'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-watermark:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. 基础环境与全局依赖准备
      # ============================================================
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安装 Python 依赖库
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml markdown pillow reportlab pypdf

      - name: 4. 安装系统依赖与中英文字体 (含 Pandoc & XeLaTeX)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-plain-generic \
            texlive-lang-chinese \
            fonts-noto-cjk \
            fonts-wqy-zenhei \
            fonts-wqy-microhei \
            libfontconfig1

      # ============================================================
      # 阶段一：水印生成与 JSON 存证
      # ============================================================
      - name: 5. 运行 CI 水印配对脚本 (兼容不同脚本命名)
        run: |
          if [ -f "scripts/generate_watermarks.py" ]; then
            python scripts/generate_watermarks.py
          elif [ -f "scripts/generate_watermark.py" ]; then
            python scripts/generate_watermark.py
          elif [ -f "scripts/watermark_ci.py" ]; then
            python scripts/watermark_ci.py
          else
            echo "❌ 未在 scripts/ 目录找到水印脚本，请核对文件名。"
            exit 1
          fi

      - name: 6. 自动提交并推送生成的水印图与 JSON 至 main 分支
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          git add CURRENCY_REGISTRY/
          
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: auto-generate secured banknote watermark [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "没有检测到新生成的水印图片/JSON，跳过提交。"
          fi

      # ============================================================
      # 阶段二：学术网页构建 + PDF 生成
      # ============================================================
      - name: 7. 构建学术 HTML 与 RSS/Sitemap 索引
        env:
          SITE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        run: |
          if [ -f "scripts/build_academic_pages.py" ]; then
            python scripts/build_academic_pages.py
          fi

      - name: 8. 自动生成学术 PDF（含防伪封面与附录）
        env:
          SITE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        run: |
          if [ -f "scripts/generate_pdf.py" ]; then
            python scripts/generate_pdf.py
          fi

      # ============================================================
      # 阶段三：部署至 GitHub Pages
      # ============================================================
      - name: 9. 部署所有产物到 GitHub Pages (gh-pages 分支)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: false

      # ============================================================
      # 阶段四：多平台时空锚定验证（可选）
      # ============================================================
      - name: 10. 验证多平台时空因果性 (T₁…T₇)
        run: |
          if [ -f "scripts/verify_time_anchor.py" ]; then
            python scripts/verify_time_anchor.py --auto-git
          fi
        continue-on-error: true
