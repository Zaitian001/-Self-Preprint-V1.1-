name: Auto Generate Preprint Watermark

on:
  push:
    paths:
      - 'PREPRINTS/**.md'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-watermark:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 安装 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: 3. 安装依赖
        run: |
          pip install markdown pyyaml pillow numpy

      - name: 4. 运行 CI 水印配对脚本
        run: python scripts/watermark_ci.py

      - name: 5. 自动提交并推送生成的水印图至 main 分支
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          git add CURRENCY_REGISTRY/
          
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: auto-generate secured banknote watermark [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "没有检测到新生成的水印图片，跳过提交。"
          fi

      # --- 阶段二：构建学术网页并发布至 GitHub Pages ---
      - name: 6. 构建学术 HTML 与 RSS/Sitemap 索引
        env:
          SITE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        run: |
          python scripts/build_academic_pages.py

      - name: 7. 部署学术网页到 GitHub Pages (gh-pages 分支)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: false
