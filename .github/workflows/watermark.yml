name: Auto Generate Preprint Watermark & Build Site

on:
  push:
    branches: [ main ]
    paths:
      - 'PREPRINTS/**.md'
      - 'CURRENCY_REGISTRY/raw/**.jpg' # 如果底图也可能直接修改，加上这个
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-watermark:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. 基础环境与全局依赖准备
      # ============================================================
      - name: 1. 拉取仓库代码 (获取完整历史)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: 2. 配置 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 降回 20 或保持 24 均可，20 更稳定

      - name: 3. 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 4. 安装 Python 依赖库
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml markdown pillow reportlab pypdf numpy

      - name: 5. 安装系统依赖与中英文字体 (含 Pandoc & XeLaTeX)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-plain-generic \
            texlive-lang-chinese \
            fonts-noto-cjk \
            fonts-wqy-zenhei \
            fonts-wqy-microhei \
            libfontconfig1

      # ============================================================
      # 🚀 核心增量优化：恢复缓存 & 获取变动文件
      # ============================================================
      - name: 6. 恢复构建缓存 (水印、JSON、PDF、HTML及Manifest)
        uses: actions/cache@v4
        with:
          path: |
            CURRENCY_REGISTRY/**.jpg
            CURRENCY_REGISTRY/**.json
            CURRENCY_REGISTRY/.watermark_manifest.json
            public/pdf/**.pdf
            public/preprints/**.html      # 🚨 新增：缓存所有已生成的论文 HTML
            public/index.html             # 🚨 新增：缓存首页
            public/feed.xml               # 🚨 新增：缓存 RSS
            public/sitemap.xml            # 🚨 新增：缓存 Sitemap
          key: build-cache-${{ runner.os }}-${{ hashFiles('PREPRINTS/**.md') }}
          restore-keys: |
            build-cache-${{ runner.os }}-

      - name: 7. 获取本次 Push 变更的 Markdown 文件列表
        id: changed-files
        run: |
          # 如果是手动触发(workflow_dispatch)或首次提交，可能没有 HEAD^，做个防呆
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            CHANGED_MD=$(git diff --name-only HEAD^ HEAD -- 'PREPRINTS/*.md' | tr '\n' ' ')
          else
            CHANGED_MD=""
          fi
          echo "CHANGED_MD=$CHANGED_MD" >> $GITHUB_ENV
          echo "本次检测到的变动文件: [$CHANGED_MD]"

      # ============================================================
      # 阶段一：水印生成与 JSON 存证
      # ============================================================
      - name: 8. 运行 CI 水印配对脚本 (精准增量)
        run: |
          if [ -n "$CHANGED_MD" ]; then
            echo "执行定向增量生成..."
            python scripts/watermark_ci.py $CHANGED_MD
          else
            echo "未检测到特定的 MD 变动，执行全量兜底扫描（由 Manifest 进行跳过保护）..."
            python scripts/watermark_ci.py
          fi

      - name: 9. 自动提交并推送生成的水印图与 JSON 至 main 分支
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          # 只添加你想提交的特定文件
          git add CURRENCY_REGISTRY/*.json CURRENCY_REGISTRY/*.jpg
          
          # 【终极防呆】检查暂存区（staged）是否有变动。
          # git diff --cached --quiet 如果有变动返回 1，没有变动返回 0。
          # 所以我们用 `!` 取反，如果有变动则进入 if 分支。
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-generate secured banknote watermark [skip ci]"
            
            # 拉取远程 main 最新提交并变基，遇到冲突优先保留 CI 生成的版本
            git pull --rebase origin main -X theirs || git rebase --skip
            
            git push origin main
          else
            echo "没有检测到新生成的水印图片/JSON，跳过提交。"
          fi

      # ============================================================
      # 阶段二：学术网页构建 + PDF 生成
      # ============================================================
      - name: 10. 构建学术 HTML 与 RSS/Sitemap 索引
        env:
          SITE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        run: |
          if [ -n "$CHANGED_MD" ]; then
            python scripts/build_academic_pages.py $CHANGED_MD
          else
            python scripts/build_academic_pages.py
          fi

      - name: 11. 自动生成学术 PDF（含防伪封面与附录）
        env:
          SITE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        run: |
          if [ -n "$CHANGED_MD" ]; then
            python scripts/generate_pdf.py $CHANGED_MD
          else
            python scripts/generate_pdf.py
          fi

      - name: 11.5 上传生成的 PDF 到 GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-pdfs
          path: public/pdf/
          retention-days: 30

      # ============================================================
      # 阶段三：时空锚定安全验证 (前置拦截)
      # ============================================================
      - name: 12. 验证多平台时空因果性与防篡改审计
        run: |
          if [ -f "scripts/verify_time_anchor.py" ]; then
            # 注意：请确保你的 verify_time_anchor.py 已经加上了时钟宽容度补丁
            python scripts/verify_time_anchor.py --auto-git
          fi
        # 这里去掉了 continue-on-error: true，一旦防篡改失败，直接阻断部署！
        continue-on-error: false

      # ============================================================
      # 阶段四：部署至 GitHub Pages
      # ============================================================
      - name: 13. 部署所有产物到 GitHub Pages (gh-pages 分支)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: false
