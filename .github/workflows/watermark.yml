name: Auto Generate Preprint Watermark

on:
  push:
    paths:
      - 'PREPRINTS/**.md'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-watermark:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. 基础环境准备（已升级到 v5，原生支持 Node.js 24）
      # ============================================================
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 2. 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 3. 安装 Python 依赖
        run: |
          pip install markdown pyyaml pillow numpy

      # ============================================================
      # 阶段一：水印生成与 JSON 存证
      # ============================================================
      - name: 4. 运行 CI 水印配对脚本
        run: python scripts/watermark_ci.py

      - name: 5. 自动提交并推送生成的水印图至 main 分支
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          git add CURRENCY_REGISTRY/
          
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: auto-generate secured banknote watermark [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "没有检测到新生成的水印图片，跳过提交。"
          fi

      # ============================================================
      # 阶段二：学术网页构建 + PDF 生成
      # ============================================================
      - name: 6. 安装 PDF 编译依赖 (Pandoc & XeLaTeX)
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-plain-generic texlive-lang-chinese

      - name: 7. 构建学术 HTML 与 RSS/Sitemap 索引
        env:
          SITE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        run: |
          python scripts/build_academic_pages.py

      - name: 8. 自动生成学术 PDF（含防伪封面与附录）
        env:
          SITE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        run: |
          python scripts/generate_pdf.py

      # ============================================================
      # 阶段三：部署至 GitHub Pages
      # ============================================================
      - name: 9. 部署所有产物到 GitHub Pages (gh-pages 分支)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: false

      # ============================================================
      # 阶段四：多平台时空锚定验证（可选）
      # ============================================================
      - name: 10. 验证多平台时空因果性 (T₁…T₇)
        run: |
          python scripts/verify_time_anchor.py --auto-git
        continue-on-error: true
