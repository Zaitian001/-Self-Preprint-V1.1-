<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DW58553901 — The Overlooked Coordinate System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.2.0/github-markdown.min.css">
  <style>
    body { background: #f6f8fa; padding: 40px; }
    .markdown-body { box-sizing: border-box; max-width: 980px; margin: 0 auto; padding: 45px; background: white; border-radius: 6px; }
  </style>
</head>
<body>
  <article class="markdown-body" id="content">Loading article…</article>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    // Fetch the markdown from the repository's main branch and render it
    (async function(){
      try {
        const res = await fetch('https://raw.githubusercontent.com/Zaitian001/-Self-Preprint-V1.1-/main/PREPRINTS/DW58553901.md');
        if (!res.ok) throw new Error('Failed to fetch markdown: ' + res.status);
        const md = await res.text();
        // Render markdown to HTML using marked
        const html = marked.parse(md);
        document.getElementById('content').innerHTML = html;
        // Make external links open in new tab
        document.querySelectorAll('#content a').forEach(a=>a.setAttribute('target','_blank'));
      } catch (e) {
        document.getElementById('content').textContent = 'Error loading article: ' + e.message;
      }
    })();
  </script>
</body>
</html>
